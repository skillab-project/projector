services:
  projector-db:
    image: postgres:16
    container_name: skillab-projector-db
    environment:
      POSTGRES_DB: skillab_projector
      POSTGRES_USER: skillab
      POSTGRES_PASSWORD: skillab
    ports:
      - "5433:5432"
    volumes:
      - projector-db-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillab -d skillab_projector"]
      interval: 5s
      timeout: 5s
      retries: 10

  projector-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: skillab-projector-api
    depends_on:
      projector-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://skillab:skillab@projector-db:5432/skillab_projector
    ports:
      - "8000:8000"
    volumes:
      - projector-api-cache:/workspace/cache_data
      - projector-api-logs:/workspace/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projector/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  projector-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: skillab-projector-dashboard
    depends_on:
      projector-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PROJECTOR_API_BASE_URL: http://projector-api:8000/projector
    command:
      - streamlit
      - run
      - app/example_dashboard/demo_dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"

  projector-snapshot-refresh:
    build:
      context: .
      dockerfile: Dockerfile.snapshot
    container_name: skillab-projector-snapshot-refresh
    depends_on:
      projector-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://skillab:skillab@projector-db:5432/skillab_projector
      SNAPSHOT_INTERVAL_MONTHS: ${SNAPSHOT_INTERVAL_MONTHS:-3}
      SNAPSHOT_CHECK_INTERVAL_DAYS: ${SNAPSHOT_CHECK_INTERVAL_DAYS:-1}
      SNAPSHOT_START_YEAR: ${SNAPSHOT_START_YEAR:-}
      SNAPSHOT_END_YEAR: ${SNAPSHOT_END_YEAR:-}
      SNAPSHOT_REGIONS: ${SNAPSHOT_REGIONS:-}
      SNAPSHOT_SKIP_GLOBAL: ${SNAPSHOT_SKIP_GLOBAL:-false}
      SNAPSHOT_RUN_IMMEDIATELY: ${SNAPSHOT_RUN_IMMEDIATELY:-true}
      SNAPSHOT_PAGE_SIZE: ${SNAPSHOT_PAGE_SIZE:-500}
      SNAPSHOT_PAGE_CONCURRENCY: ${SNAPSHOT_PAGE_CONCURRENCY:-4}
      SNAPSHOT_MAX_RETRIES: ${SNAPSHOT_MAX_RETRIES:-5}
      SNAPSHOT_SCHEDULER_LOG_FILE: ${SNAPSHOT_SCHEDULER_LOG_FILE:-logs/sector_snapshot_scheduler.log}
      SNAPSHOT_DEBUG: ${SNAPSHOT_DEBUG:-false}
    volumes:
      - projector-snapshot-cache:/workspace/cache_data
      - projector-snapshot-logs:/workspace/logs
    restart: always

volumes:
  projector-db-data:
  projector-api-cache:
  projector-api-logs:
  projector-snapshot-cache:
  projector-snapshot-logs:
